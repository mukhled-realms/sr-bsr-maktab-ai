<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتب السرعة للخدمات الرقمية</title>
    <!-- استخدام Tailwind للتصميم السريع والفخم -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* تخصيص الألوان لتعطي طابع داكن وفخم (سايبربانك/ذهبي) */
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .accent-gold { color: #fbbf24; }
        .bg-gold { background-color: #fbbf24; }
        .border-gold { border-color: #fbbf24; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-700">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold accent-gold mb-2">مكتب السرعة</h1>
            <p class="text-gray-400 text-sm">للخدمات الرقمية والمعاملات الحكومية</p>
        </div>

        <form id="serviceForm" onsubmit="handleFormSubmit(event)" class="space-y-5">
            
            <!-- اختيار الخدمة -->
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-300">نوع الخدمة المطلوبة</label>
                <select id="serviceType" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none focus:border-gold">
                    <option value="" disabled selected>اختر الخدمة...</option>
                    <option value="تجديد إقامة">تجديد إقامة</option>
                    <option value="نقل خدمات">نقل خدمات / كفالة</option>
                    <option value="إصدار سجل تجاري">إصدار سجل تجاري</option>
                    <option value="خدمات قوى / مدد">خدمات منصة قوى / مدد</option>
                    <option value="استشارة عامة">استشارة عامة</option>
                </select>
            </div>

            <!-- اسم العميل -->
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-300">الاسم الكريم</label>
                <input type="text" id="clientName" required placeholder="أدخل اسمك" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none focus:border-gold">
            </div>

            <!-- رقم الجوال -->
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-300">رقم الجوال (للتواصل)</label>
                <input type="tel" id="clientPhone" required placeholder="05xxxxxxxx" pattern="^05[0-9]{8}$" title="يجب أن يبدأ بـ 05 ويتكون من 10 أرقام" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none focus:border-gold text-right" dir="ltr">
            </div>

            <!-- موافقة PDPL (مهم جداً) -->
            <div class="flex items-start mt-4 bg-gray-900 p-3 rounded-lg border border-gray-700">
                <div class="flex items-center h-5">
                    <input id="pdplCheckbox" type="checkbox" required class="w-5 h-5 accent-yellow-500 rounded focus:ring-yellow-500">
                </div>
                <div class="mr-3 text-sm">
                    <label for="pdplCheckbox" class="font-medium text-gray-300">أوافق على سياسة الخصوصية</label>
                    <p class="text-gray-500 text-xs mt-1">أوافق على معالجة بياناتي لإتمام المعاملة، وأقر بعدم إرسال أي بيانات هويات إلا عند الطلب عبر الواتساب.</p>
                </div>
            </div>

            <!-- زر الإرسال -->
            <button type="submit" id="submitBtn" class="w-full bg-gold hover:bg-yellow-500 text-gray-900 font-bold py-3 px-4 rounded-lg transition duration-200 flex justify-center items-center gap-2">
                <span>تأكيد والتحويل للواتساب</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 1.414L10.586 9H7a1 1 0 100 2h3.586l-1.293 1.293a1 1 0 101.414 1.414l3-3a1 1 0 000-1.414z" clip-rule="evenodd" />
                </svg>
            </button>
            <p id="statusMsg" class="text-center text-sm text-red-400 hidden mt-2"></p>
        </form>
    </div>

    <script>
        async function handleFormSubmit(event) {
            event.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('statusMsg');
            btn.disabled = true;
            btn.innerHTML = 'جاري التجهيز... ⏳';

            const name = document.getElementById('clientName').value.trim();
            const phone = document.getElementById('clientPhone').value.trim();
            const service = document.getElementById('serviceType').value;
            const pdplAgreed = document.getElementById('pdplCheckbox').checked;

            try {
                // استدعاء الباك إند (يجب تغيير الرابط لرابط الـ Render الخاص بك عند الرفع)
                // مثال: const backendUrl = 'https://your-app-name.onrender.com/api/submit-request';
                const backendUrl = '/api/submit-request'; 

                const response = await fetch(backendUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, phone, service, pdplAgreed })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'حدث خطأ في النظام');
                }

                // إذا نجح الاتصال، نجهز رسالة الواتساب الأنيقة للسوداني
                const officePhone = '966577619578';
                const message = `السلام عليكم مكتب السرعة،\n\n📌 *طلب خدمة جديدة*\n▪️ *الخدمة:* ${service}\n👤 *الاسم:* ${name}\n📱 *الجوال:* ${phone}\n\n✅ _أوافق على سياسة معالجة البيانات_`;
                
                const encodedMessage = encodeURIComponent(message);
                const waUrl = `https://wa.me/${officePhone}?text=${encodedMessage}`;

                // فتح الواتساب مباشرة
                window.location.href = waUrl;

            } catch (error) {
                statusMsg.textContent = error.message;
                statusMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = 'حاول مرة أخرى';
            }
        }
    </script>
</body>
</html>
